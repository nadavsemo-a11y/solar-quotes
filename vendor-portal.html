<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>SEMO AGS — פורטל ספק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* A.G.S design tokens (claude.ai/design 527204cc) applied as a DARK surface.
   Black is a core brand colour and the system ships --bg-inverse/--fg-on-dark
   for exactly this, so "dark" here is the brand's own inverse, not a new palette.

   Brand rules honoured: three core colours (black / white / mint), mint used as
   a SINGLE accent rather than a default, hard geometry (radii 0-8px, 2px
   borders, the signature 4px 4px 0 offset shadow), flat fills — no gradients,
   no emoji. Semantic status colours come from the solar palette.

   Variable names are the portal's originals so every existing rule keeps
   working; only their values changed. */
:root {
  /* core brand */
  --ags-black: #0A0A0A; --ags-white: #FFFFFF;
  --ags-mint: #9CF5C4; --ags-mint-deep: #5FE0A0;
  /* neutrals */
  --ink-800: #1A1A1A; --ink-700: #2B2B2B; --ink-600: #4A4A4A;
  --ink-400: #9A9A9A; --ink-300: #C4C4C4;

  /* the portal's own names, repointed */
  --sun: var(--ags-mint);            /* THE single accent for this view */
  --sun-light: var(--ags-mint-deep);
  --accent: var(--ags-mint);
  --sky: #0A0A0A; --sky-mid: #1A1A1A; --sky-light: #2B2B2B;
  --green: #2EB872; --green-dark: #2EB872; --red: #D43A2F; --warn: #E89923;
  --text: #FFFFFF; --gray: #9A9A9A; --gray-light: #4A4A4A;
  --light: #0A0A0A; --white: #1A1A1A; --border: #2B2B2B;
  --radius: 8px; --radius-sm: 4px;   /* hard geometry: never 16px */
  --shadow: none;                     /* flat-first */
  --shadow-hard: 4px 4px 0 var(--ags-mint);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Heebo', 'Helvetica Neue', system-ui, sans-serif; background: var(--light); color: var(--text); min-height: 100vh; }

/* Form controls do not inherit a dark surface on their own — without this they
   render as white boxes punched into the theme. */
input[type="date"], input[type="text"], input[type="number"], select, textarea {
  background: #12141c; color: var(--text); border: 1px solid var(--border);
  color-scheme: dark;   /* makes the native date picker dark too */
}
input::placeholder, textarea::placeholder { color: var(--gray-light); }
button { font-family: inherit; cursor: pointer; border: none; }

/* ── Header ── */
.header {
  background: var(--ags-black); border-bottom: 2px solid var(--border);
  padding: 20px 28px; display: flex; align-items: center; justify-content: space-between;
  box-shadow: none;
}
.logo { display: flex; align-items: center; gap: 14px; color: white; }
.logo img { height: 38px; }
.logo-title { font-size: 13px; font-weight: 600; opacity: 0.7; }
.logo-name { font-size: 20px; font-weight: 900; color: var(--sun); }
.header-badge {
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  color: white; padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
}

/* ── Main ── */
.main { max-width: 900px; margin: 0 auto; padding: 28px 20px; }
.page-title { text-align: center; margin-bottom: 28px; }
.page-title h1 { font-size: 26px; font-weight: 900; color: var(--text); }
.page-title h1 span { color: var(--sun); }
.page-title p { font-size: 14px; color: var(--gray); margin-top: 4px; }

/* ── Table ── */
.table-card {
  background: var(--white); border: 2px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
.table-card-header {
  background: var(--ags-black); border-bottom: 2px solid var(--border);
  padding: 14px 24px; color: white; font-size: 15px; font-weight: 700;
  display: flex; align-items: center; gap: 10px;
}
.table-card-header .icon {
  width: 28px; height: 28px; background: rgba(255,255,255,0.15); border-radius: 4px;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
table { width: 100%; border-collapse: collapse; }
thead th {
  padding: 12px 16px; font-size: 12px; font-weight: 700; color: var(--gray);
  text-transform: uppercase; letter-spacing: 0.5px; text-align: right;
  border-bottom: 2px solid var(--border); background: var(--light);
}
tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,0.035); }
tbody td { padding: 14px 16px; font-size: 14px; vertical-align: middle; }
tbody tr.highlight-row { animation: rowHighlight 5s ease-out; }
@keyframes rowHighlight {
  0% { background: rgba(156,245,196,0.20); }
  70% { background: rgba(156,245,196,0.08); }
  100% { background: transparent; }
}

.td-project { font-weight: 700; }
.td-task { color: var(--gray); font-size: 13px; }
.td-address { font-size: 13px; color: var(--gray); }
.td-phone a { color: var(--ags-white); text-decoration: underline;
  text-decoration-thickness: 1.5px; text-underline-offset: 3px; font-size: 13px; }
.td-phone a:hover { text-decoration: underline; }
.td-date input {
  padding: 5px 8px; border-radius: 4px; border: 1px solid var(--border);
  background: var(--light); color: var(--text); font-family: inherit;
  font-size: 13px; direction: ltr; width: 130px;
}
.td-date input:focus { outline: none; border-color: var(--sun); }

/* ── File ── */
.file-btn {
  padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 600;
  transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px;
}
.file-btn.upload {
  background: var(--light); border: 1px solid var(--border); color: var(--gray);
}
.file-btn.upload:hover { border-color: var(--sun); color: var(--sun); }
.file-btn.done { background: rgba(46,204,113,0.12); color: var(--green); border: 1px solid rgba(46,204,113,0.35); cursor: default; }
.file-btn.uploading { background: var(--light); color: var(--gray); border: 1px solid var(--border); cursor: wait; }
input[type="file"] { display: none; }

/* ── Action Buttons ── */
.btn-done-sm {
  padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 700;
  transition: all 0.2s;
}
.btn-done-sm.ready {
  background: var(--ags-mint); color: var(--ags-black);
  color: var(--ags-black); box-shadow: none;
}
.btn-done-sm.ready:hover { box-shadow: var(--shadow-hard); }
.btn-done-sm.disabled {
  background: var(--light); color: var(--gray-light); border: 1px solid var(--border); cursor: not-allowed;
}
.btn-doc {
  padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: 600;
  background: transparent; color: var(--ags-white); border: 2px solid var(--border);
  text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
}
.btn-doc:hover { border-color: var(--ags-mint); color: var(--ags-mint); }

/* ── Undo Bar ── */
.undo-bar {
  display: inline-flex; align-items: center; gap: 10px; padding: 6px 14px;
  border-radius: 8px; background: var(--sky); color: white; font-size: 13px; font-weight: 600;
  animation: fadeIn 0.2s;
}
.undo-countdown { color: var(--sun); font-weight: 800; font-size: 16px; direction: ltr; }
.undo-cancel {
  background: rgba(255,255,255,0.15); color: white; border: none;
  padding: 3px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; font-family: inherit;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ── States ── */
.completing { opacity: 0.4; }
.done-exit { opacity: 0; height: 0; overflow: hidden; transition: all 0.4s; }

.empty-state { text-align: center; padding: 60px 20px; }
.empty-icon { font-size: 64px; margin-bottom: 16px; }
.empty-title { font-size: 22px; font-weight: 900; color: var(--text); margin-bottom: 8px; }
.empty-text { font-size: 15px; color: var(--gray); }

.loading { text-align: center; padding: 60px 20px; }
.spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--sun); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  padding: 12px 24px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700;
  z-index: 200; box-shadow: 0 8px 32px rgba(0,0,0,0.15); transition: all 0.3s;
  opacity: 0; pointer-events: none;
}
.toast.visible { opacity: 1; }
.toast.success { background: var(--green); color: #fff; }
.toast.error { background: var(--red); color: #fff; }

/* ── Expandable Fields Row ── */
.table-card + .table-card { margin-top: 22px; }
.group-count { margin-inline-start: auto; background: rgba(255,255,255,.18); border-radius: 99px;
  padding: 2px 10px; font-size: 13px; font-weight: 700; }
.ref-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.ref-item { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ref-label { min-width: 190px; font-size: 13px; font-weight: 600; color: var(--gray); }
.ref-files { display: flex; flex-wrap: wrap; gap: 6px; }
.ref-dl { white-space: nowrap; }
.ref-text { font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 13px; font-weight: 500; word-break: break-word; direction: ltr; }
.ref-missing { font-size: 13px; font-weight: 700; color: var(--warn); }
@media (max-width: 700px) { .ref-label { min-width: 0; width: 100%; } }
.fields-row td { padding: 0 !important; border-bottom: 1px solid var(--border); }
.fields-content {
  padding: 14px 20px; background: var(--light);
}
.fields-content .field-label {
  font-size: 11px; font-weight: 700; color: var(--gray); text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 8px;
}
.serial-list { display: flex; flex-direction: column; gap: 8px; }
.serial-entry {
  display: flex; align-items: center; gap: 8px;
}
.serial-num {
  width: 24px; height: 24px; border-radius: 50%; background: var(--sky);
  color: var(--sun); font-size: 11px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.serial-input {
  flex: 1; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--white); color: var(--text); font-size: 14px; font-family: inherit;
  direction: ltr; letter-spacing: 1px;
}
.serial-input:focus { outline: none; border-color: var(--ags-mint); box-shadow: none; }
.serial-remove {
  width: 26px; height: 26px; border-radius: 50%; background: rgba(231,76,60,0.08);
  color: var(--red); border: 1px solid rgba(231,76,60,0.2); font-size: 16px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
}
.serial-remove:hover { background: rgba(231,76,60,0.15); }
.btn-add-serial {
  margin-top: 8px; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 700;
  background: transparent; color: var(--ags-white); border: 2px solid var(--border);
  display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
}
.btn-add-serial:hover { border-color: var(--ags-mint); color: var(--ags-mint); }

.muted { color: var(--gray); font-size: 13px; }
.toast.info { background: var(--ink-700); color: #fff; }
.notice { margin: 0 0 14px; padding: 10px 14px; border: 1px solid var(--warn); border-radius: var(--radius); color: var(--text); font-size: 14px; line-height: 1.6; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.notice-row td .notice { margin: 8px 14px; }
.footer { text-align: center; padding: 20px; font-size: 12px; color: var(--gray-light); }

@media (max-width: 700px) {
  table, thead, tbody, th, td, tr { display: block; }
  thead { display: none; }
  tbody tr { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; padding: 14px; background: var(--white); }
  tbody td { padding: 4px 0; border: none; display: flex; justify-content: space-between; align-items: center; }
  tbody td::before { content: attr(data-label); font-size: 11px; font-weight: 700; color: var(--gray); text-transform: uppercase; }
  .td-actions { justify-content: flex-end; gap: 8px; margin-top: 8px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <img src="ags-logo-white.png" alt="A.G.S">
    <div>
      <div class="logo-title">פורטל ספק</div>
      <div class="logo-name" id="vendorName">—</div>
    </div>
  </div>
  <div class="header-badge" id="taskCount">—</div>
</header>

<div class="main">
  <div class="page-title">
    <h1>הזמנות <span>פתוחות</span></h1>
    <p id="subtitle">טוען...</p>
  </div>
  <div id="content">
    <div class="loading"><div class="spinner"></div><div style="color:var(--gray)">טוען...</div></div>
  </div>
</div>

<div class="footer">SEMO A.G.S — Solar Operations System</div>
<div class="toast" id="toast"></div>

<script>
const V = window.__VENDOR__ || {};
const API = V.apiBase || '';
const TOKEN = V.token || '';
const URL_PARAMS = new URLSearchParams(window.location.search);
const IS_DEMO = URL_PARAMS.get('demo') === 'true';
const DEMO_TYPE = URL_PARAMS.get('type') || '';
const HIGHLIGHT_REF = URL_PARAMS.get('highlight') || '';
const Q_TOKEN = encodeURIComponent(TOKEN);

let tasks = [];
let unavailableCount = 0;
const uploadedFiles = {};
const fieldValues = {};

// What the server answered, in words a supplier can act on. Codes, never raw server text.
const MESSAGES = {
  unsupported_file_type: 'ניתן לצרף רק קובץ PDF או תמונה (JPG / PNG / HEIC).',
  file_too_large: 'הקובץ גדול מדי — עד 10MB.',
  empty_file: 'הקובץ ריק.',
  task_completed: 'המשימה כבר סומנה כבוצעה.',
  not_allowed: 'הפעולה הזו אינה זמינה למשימה הזו.',
  not_owned: 'המשימה אינה משויכת אליך יותר. פנה למשרד.',
  invalid_token: 'הקישור אינו פעיל. פנה למשרד לקבלת קישור חדש.',
  task_type_unavailable: 'המשימה אינה זמינה כרגע בפורטל — המשרד עודכן. פנה למשרד.',
  rules_unavailable: 'המערכת אינה זמינה כרגע. נסה שוב בעוד כמה דקות.',
  requirements_missing: 'חסר תוצר נדרש לפני סימון בוצע.',
  partial_failure: 'הדיווח לא הושלם — לא סומן בוצע. נסה שוב.',
  upstream_error: 'השמירה נכשלה. נסה שוב.',
  invalid_input: 'הנתונים שהוזנו אינם תקינים.',
  invalid_serial: 'מספר סיריאלי לא תקין — אותיות לועזיות, ספרות ומקף בלבד.',
  too_many_serials: 'יותר מדי מספרים סיריאליים.',
};
const MISSING = { file: 'קובץ', serials: 'מספרים סיריאליים' };

function messageFor(data, fallback) {
  if (!data) return fallback;
  if (data.code === 'requirements_missing' && Array.isArray(data.missing)) {
    return 'חסר לפני סימון בוצע: ' + data.missing.map((m) => MISSING[m] || m).join(', ');
  }
  return MESSAGES[data.reason] || MESSAGES[data.code] || fallback;
}

async function api(path, init) {
  const res = await fetch(`${API}${path}`, init);
  let data = null;
  try { data = await res.json(); } catch { data = null; }
  return { ok: res.ok && !!data && data.success !== false, status: res.status, data };
}
const postJson = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: TOKEN, ...body }) });

document.getElementById('vendorName').textContent = V.supplierName || '';
loadTasks();

async function loadTasks() {
  try {
    const demoParam = IS_DEMO ? `&demo=true${DEMO_TYPE ? '&type=' + encodeURIComponent(DEMO_TYPE) : ''}` : '';
    const r = await api(`/v/api/tasks?token=${Q_TOKEN}${demoParam}`);
    if (!r.ok) { showError(messageFor(r.data, 'שגיאה בטעינת המשימות')); return; }

    document.getElementById('vendorName').textContent = r.data.supplierName || V.supplierName || '';
    tasks = r.data.tasks || [];
    unavailableCount = Number(r.data.unavailable) || 0;
    updateCounts();
    render();

    if (HIGHLIGHT_REF) {
      setTimeout(() => {
        const row = document.getElementById(`row-${HIGHLIGHT_REF}`);
        if (row) { row.classList.add('highlight-row'); row.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      }, 300);
    }
  } catch (e) { showError('שגיאת חיבור — בדוק את האינטרנט ונסה שוב.'); }
}

function render() {
  const el = document.getElementById('content');
  const unavailable = unavailableCount
    ? `<div class="notice">${unavailableCount === 1 ? 'משימה אחת אינה זמינה' : `${unavailableCount} משימות אינן זמינות`} כרגע בפורטל. המשרד מטפל בזה.</div>`
    : '';
  if (tasks.length === 0) {
    el.innerHTML = unavailable + `<div class="empty-state"><div class="empty-icon"></div><div class="empty-title">אין הזמנות פתוחות</div><div class="empty-text">אין כרגע הזמנות שדורשות טיפול.</div></div>`;
    return;
  }

  // One table per task TYPE: different jobs need different columns, and mixing them forces a
  // reader to check the task name on every row. Insertion order is preserved.
  const groups = [];
  const byName = new Map();
  for (const t of tasks) {
    let g = byName.get(t.taskName);
    if (!g) { g = { name: t.taskName, tasks: [] }; byName.set(t.taskName, g); groups.push(g); }
    g.tasks.push(t);
  }
  el.innerHTML = unavailable + groups.map(g => renderGroup(g.name, g.tasks, groups.length > 1)).join('');
}

// Render one task type as a self-contained card. Column set is computed from
// THIS group only, so an empty column never appears just because some other
// task type needs it.
function renderGroup(groupName, tasks, showName) {
  const needsFile = tasks.some(t => t.taskRules?.requireFile);
  // The server sends the build plan only for task types that show it; the
  // client check is belt and braces for an older server.
  const hasDesignFiles = tasks.some(t => t.designFiles?.length > 0 && t.taskRules?.showDesignPlan !== false);
  // The planned date is not universal (showPlannedDate in the task rules).
  const showsDate = tasks.some(t => t.taskRules?.showPlannedDate !== false);
  // The customer's phone is sent only for on-site task types.
  const showsPhone = tasks.some(t => t.phone);

  let cols = `<th>פרויקט</th><th>הספק DC</th><th>כתובת</th>`;
  if (showsPhone) cols += `<th>טלפון</th>`;
  if (showsDate) cols += `<th>תאריך מתוכנן</th>`;
  if (hasDesignFiles) cols += `<th>תכנית הקמה</th>`;
  if (needsFile) cols += `<th>קובץ</th>`;
  cols += `<th>פעולה</th>`;

  const rows = tasks.map(t => {
    if (t.hasFile) uploadedFiles[t.ref] = { name: 'קיים', uploaded: true };
    const dateVal = t.plannedDate ? t.plannedDate.split(' ')[0] : '';
    const rules = t.taskRules || {};

    const phoneTd = showsPhone
      ? `<td data-label="טלפון" class="td-phone">${t.phone ? `<a href="tel:${esc(t.phone)}">${esc(t.phone)}</a>` : '—'}</td>`
      : '';
    const dateTd = showsDate
      ? `<td data-label="תאריך" class="td-date"><input type="date" value="${esc(dateVal)}" onchange="updateDate('${t.ref}', this.value)"></td>`
      : '';

    let designTd = '';
    if (hasDesignFiles) {
      designTd = t.designFiles?.length > 0
        ? `<td data-label="תכנית הקמה"><div style="display:flex;flex-direction:column;gap:3px;">${t.designFiles.map(f =>
            `<a class="btn-doc" href="${esc(f.url)}" download style="margin-bottom:3px;">${esc(f.name)}</a>`).join('')}</div></td>`
        : `<td data-label="תכנית הקמה"><span style="color:var(--gray-light)">—</span></td>`;
    }

    let fileTd = '';
    if (needsFile) {
      if (!rules.requireFile) {
        fileTd = `<td data-label="קובץ">—</td>`;
      } else if (t.hasFile) {
        fileTd = `<td data-label="קובץ"><span class="file-btn done">צורף</span></td>`;
      } else {
        fileTd = `<td data-label="קובץ" id="file-cell-${t.ref}">
          <button class="file-btn upload" onclick="document.getElementById('file-${t.ref}').click()">${esc(rules.fileLabel || 'צרף קובץ')}</button>
          <input type="file" id="file-${t.ref}" accept="application/pdf,image/jpeg,image/png,image/heic" onchange="onFileSelect('${t.ref}', this)">
        </td>`;
      }
    }

    // Full-width sub-rows (serials, reference documents) span every column:
    // three fixed (project, DC, address), the optional ones as the header counts
    // them, and the action column that closes the row.
    const colSpan = 3 + (showsPhone ? 1 : 0) + (showsDate ? 1 : 0) + (hasDesignFiles ? 1 : 0) + (needsFile ? 1 : 0) + 1;

    let fieldsRow = '';
    if (rules.serialNumbers) {
      const stored = Array.isArray(t.serials) ? t.serials : [];
      const initial = stored.length ? stored : [''];
      if (!fieldValues[t.ref]) fieldValues[t.ref] = { _serials: stored.slice() };
      fieldsRow = `<tr class="fields-row" id="fields-${t.ref}"><td colspan="${colSpan}">
        <div class="fields-content">
          <div class="field-label">${esc(rules.serialLabel || 'מספרים סיריאליים')} <span style="color:var(--red)">*</span>${stored.length ? ' <span class="muted">(נשמרו קודם)</span>' : ''}</div>
          <div class="serial-list" id="serial-list-${t.ref}">${initial.map((v, i) => `
            <div class="serial-entry">
              <span class="serial-num">${i + 1}</span>
              <input class="serial-input" type="text" dir="ltr" inputmode="text" autocapitalize="characters" value="${esc(v)}" placeholder="מספר סיריאלי" oninput="onSerialChange('${t.ref}')">
            </div>`).join('')}
          </div>
          <button class="btn-add-serial" onclick="addSerial('${t.ref}')">+ הוסף ממיר</button>
        </div>
      </td></tr>`;
    }

    // Reference documents — upstream artifacts this task CONSUMES. Read-only:
    // produced by other subcontractors on sibling tasks. A missing one is shown,
    // never hidden, and never blocks completion.
    let refsRow = '';
    if (t.references && t.references.length) {
      const items = t.references.map(r => {
        const label = `<span class="ref-label">${esc(r.label)}</span>`;
        if (r.missing) return `<div class="ref-item">${label}<span class="ref-missing">חסר</span></div>`;
        if (r.type === 'file') {
          const links = (r.files || []).map(f => `<a class="btn-doc ref-dl" href="${esc(f.downloadUrl)}" download>${esc(f.name)}</a>`).join('');
          return `<div class="ref-item">${label}<span class="ref-files">${links}</span></div>`;
        }
        return `<div class="ref-item">${label}<span class="ref-text">${esc(r.text)}</span></div>`;
      }).join('');
      refsRow = `<tr class="fields-row" id="refs-${t.ref}"><td colspan="${colSpan}">
        <div class="fields-content">
          <div class="field-label">מסמכי עזר</div>
          <div class="ref-list">${items}</div>
        </div>
      </td></tr>`;
    }

    return `<tr id="row-${t.ref}">
      <td data-label="פרויקט" class="td-project">${esc(t.projectName)}</td>
      <td data-label="הספק DC" class="td-task">${t.dcPower ? esc(t.dcPower) + ' kWp' : '—'}</td>
      <td data-label="כתובת" class="td-address">${esc(t.address || '—')}</td>
      ${phoneTd}
      ${dateTd}
      ${designTd}
      ${fileTd}
      <td data-label="פעולה" class="td-actions" id="action-${t.ref}">
        <button class="btn-done-sm ${canComplete(t) ? 'ready' : 'disabled'}" id="btn-${t.ref}"
          onclick="handleDone('${t.ref}')" ${canComplete(t) ? '' : 'disabled'}>בוצע</button>
      </td>
    </tr>${fieldsRow}${refsRow}<tr class="fields-row notice-row" id="notice-${t.ref}" hidden><td colspan="${colSpan}"></td></tr>`;
  }).join('');

  const header = showName ? esc(groupName) : 'הזמנות פתוחות';
  return `<div class="table-card">
    <div class="table-card-header">${header}
      <span class="group-count">${tasks.length}</span>
    </div>
    <table><thead><tr>${cols}</tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

// ── Office notification: saved data stays saved; only the message is retried ──
const NOTICE_TEXT = {
  file_uploaded: 'הקובץ נשמר, אבל ההודעה למשרד לא נשלחה.',
  task_completed: 'המשימה סומנה כבוצעה, אבל ההודעה למשרד לא נשלחה.',
  report_pending_review: 'הדיווח נשמר, אבל ההודעה למשרד לא נשלחה.',
  planned_date_set: 'התאריך נשמר, אבל ההודעה למשרד לא נשלחה.',
};

function showNotificationRetry(ref, kind) {
  const row = document.getElementById(`notice-${ref}`);
  if (!row) { showToast(NOTICE_TEXT[kind] + ' אין צורך לשלוח שוב את הנתונים.', 'error'); return; }
  row.hidden = false;
  row.firstElementChild.innerHTML = `<div class="notice">${esc(NOTICE_TEXT[kind])} אין צורך להעלות או לדווח שוב.
    <button class="btn-doc" onclick="retryNotification('${ref}', '${kind}', this)">שלח הודעה שוב</button></div>`;
}

async function retryNotification(ref, kind, btn) {
  if (btn) btn.disabled = true;
  try {
    const r = await postJson('/v/api/notify', { taskRef: ref, kind });
    if (r.ok) {
      const row = document.getElementById(`notice-${ref}`);
      if (row) row.hidden = true;
      showToast('ההודעה נשלחה למשרד', 'success');
      return;
    }
    showToast('ההודעה עדיין לא נשלחה — נסה שוב מאוחר יותר', 'error');
  } catch { showToast('שגיאת חיבור — נסה שוב', 'error'); }
  if (btn) btn.disabled = false;
}

function checkNotification(ref, data, kind) {
  if (!IS_DEMO && data && data.notification && data.notification.ok === false && data.notification.retryable) showNotificationRetry(ref, kind);
}

// ── Serials ──
function addSerial(ref) {
  const list = document.getElementById(`serial-list-${ref}`);
  const count = list.querySelectorAll('.serial-entry').length + 1;
  const entry = document.createElement('div');
  entry.className = 'serial-entry';
  entry.innerHTML = `
    <span class="serial-num">${count}</span>
    <input class="serial-input" type="text" dir="ltr" autocapitalize="characters" placeholder="מספר סיריאלי" oninput="onSerialChange('${ref}')">
    <button class="serial-remove" onclick="removeSerial(this, '${ref}')">&times;</button>`;
  list.appendChild(entry);
}

function removeSerial(btn, ref) {
  btn.closest('.serial-entry').remove();
  renumberSerials(ref);
  onSerialChange(ref);
}

function renumberSerials(ref) {
  document.getElementById(`serial-list-${ref}`).querySelectorAll('.serial-entry').forEach((entry, i) => {
    entry.querySelector('.serial-num').textContent = i + 1;
  });
}

function onSerialChange(ref) {
  if (!fieldValues[ref]) fieldValues[ref] = {};
  fieldValues[ref]._serials = getSerials(ref);
  updateDoneButton(ref);
}

function getSerials(ref) {
  const list = document.getElementById(`serial-list-${ref}`);
  if (!list) return [];
  return Array.from(list.querySelectorAll('.serial-input')).map(i => i.value.trim()).filter(Boolean);
}

// ── File ──
async function onFileSelect(ref, input) {
  const file = input.files[0]; if (!file) return;
  const cell = document.getElementById(`file-cell-${ref}`);
  const original = cell.innerHTML;
  cell.innerHTML = `<span class="file-btn uploading">מעלה...</span>`;

  if (IS_DEMO) {
    uploadedFiles[ref] = { name: file.name, uploaded: true };
    cell.innerHTML = `<span class="file-btn done">${esc(file.name)}</span>`;
    showToast('קובץ הועלה (דמו)', 'success'); updateDoneButton(ref); return;
  }
  if (file.size > 10 * 1024 * 1024) { cell.innerHTML = original; showToast(MESSAGES.file_too_large, 'error'); return; }
  try {
    const fd = new FormData(); fd.append('file', file);
    const r = await api(`/v/api/upload?token=${Q_TOKEN}&ref=${encodeURIComponent(ref)}`, { method: 'POST', body: fd });
    if (!r.ok) throw r.data || {};
    uploadedFiles[ref] = { name: r.data.fileName || file.name, uploaded: true };
    cell.innerHTML = `<span class="file-btn done">${esc(r.data.fileName || file.name)}</span>`;
    showToast('הקובץ נשמר', 'success');
    checkNotification(ref, r.data, 'file_uploaded');
  } catch (e) {
    cell.innerHTML = original;
    showToast(messageFor(e, 'ההעלאה נכשלה — נסה שוב'), 'error');
  }
  updateDoneButton(ref);
}

// ── Validation (the server decides; this only keeps the button honest) ──
function canComplete(task) {
  const r = task.taskRules || {};
  if (r.requireFile && !uploadedFiles[task.ref]?.uploaded) return false;
  if (r.serialNumbers && getSerials(task.ref).length === 0 && !(task.serials && task.serials.length)) return false;
  return true;
}
function updateDoneButton(ref) {
  const t = tasks.find(x => x.ref === ref); if (!t) return;
  const btn = document.getElementById(`btn-${ref}`); if (!btn) return;
  const ok = canComplete(t);
  btn.className = `btn-done-sm ${ok ? 'ready' : 'disabled'}`; btn.disabled = !ok;
}

// ── Done, with a 5-second undo before anything is sent ──
function handleDone(ref) {
  const t = tasks.find(x => x.ref === ref);
  if (!t || !canComplete(t)) return;
  const row = document.getElementById(`row-${ref}`);
  const cell = document.getElementById(`action-${ref}`);
  let cancelled = false, countdown = 5;
  row.classList.add('completing');

  cell.innerHTML = `<div class="undo-bar">
    <button class="undo-cancel" id="undo-${ref}">&#8617; ביטול</button>
    <span class="undo-countdown" id="cd-${ref}">${countdown}</span>
  </div>`;

  const iv = setInterval(() => { countdown--; const c = document.getElementById(`cd-${ref}`); if (c) c.textContent = countdown; if (countdown <= 0) clearInterval(iv); }, 1000);
  const to = setTimeout(async () => { clearInterval(iv); if (!cancelled) await executeDone(ref, t); }, 5000);

  document.getElementById(`undo-${ref}`).onclick = () => {
    cancelled = true; clearTimeout(to); clearInterval(iv);
    row.classList.remove('completing');
    restoreDoneButton(ref, t);
    showToast('בוטל — לא נשלח דבר', 'success');
  };
}

function restoreDoneButton(ref, t) {
  const ok = canComplete(t);
  document.getElementById(`action-${ref}`).innerHTML = `<button class="btn-done-sm ${ok ? 'ready' : 'disabled'}" id="btn-${ref}" onclick="handleDone('${ref}')" ${ok ? '' : 'disabled'}>בוצע</button>`;
}

function removeRow(ref) {
  document.getElementById(`row-${ref}`)?.classList.add('done-exit');
  setTimeout(() => {
    tasks = tasks.filter(x => x.ref !== ref); updateCounts();
    if (!tasks.length) render();
    else ['row', 'fields', 'refs', 'notice'].forEach(p => document.getElementById(`${p}-${ref}`)?.remove());
  }, 400);
}

async function executeDone(ref, t) {
  if (IS_DEMO) { showToast(`[דמו] ${t.projectName} — בוצע`, 'success'); removeRow(ref); return; }
  const row = document.getElementById(`row-${ref}`);
  try {
    const serials = getSerials(ref);
    const fields = serials.length > 0 ? { 'סיריאלי ממירים': serials.join('; ') } : {};
    const r = await postJson('/v/api/done', { taskRef: ref, fields, note: '' });
    if (!r.ok) throw r.data || {};
    row.classList.remove('completing');
    if (r.data.statusChanged === false && r.data.pendingExpenseReview) {
      // Installation: the report is recorded; the office completes the task after its expense review.
      document.getElementById(`action-${ref}`).innerHTML = '<span class="muted">הדיווח התקבל · ממתין לבדיקת המשרד</span>';
      showToast('הדיווח התקבל. המשרד ישלים את המשימה לאחר בדיקה.', 'info');
      checkNotification(ref, r.data, 'report_pending_review');
      return;
    }
    showToast(r.data.alreadyDone ? `${t.projectName} — כבר סומן כבוצע` : `${t.projectName} — בוצע ✓`, 'success');
    if (!IS_DEMO && r.data.notification && r.data.notification.ok === false && r.data.notification.retryable) {
      // Keep the row only long enough to offer the retry; the task itself is done.
      document.getElementById(`action-${ref}`).innerHTML = '<span class="muted">בוצע ✓</span>';
      showNotificationRetry(ref, 'task_completed');
      return;
    }
    removeRow(ref);
  } catch (e) {
    row.classList.remove('completing');
    restoreDoneButton(ref, t);
    showToast(messageFor(e, 'הסימון נכשל — נסה שוב'), 'error');
  }
}

function updateCounts() {
  document.getElementById('taskCount').textContent = tasks.length > 0 ? `${tasks.length} הזמנות` : 'אין הזמנות';
  document.getElementById('subtitle').textContent = tasks.length > 0 ? `${tasks.length} הזמנות ממתינות לטיפול` : '';
}

async function updateDate(ref, date) {
  if (IS_DEMO) { showToast('[דמו] תאריך עודכן', 'success'); return; }
  if (!date) return;
  try {
    const r = await postJson('/v/api/date', { taskRef: ref, date });
    if (!r.ok) { showToast(messageFor(r.data, 'עדכון התאריך נכשל'), 'error'); return; }
    // For task types configured with dateAdvancesStatus (the IEC-inspection task), entering the
    // date is also what moves the task forward; the server reports the resulting status.
    showToast(r.data.status ? `התאריך נשמר — הסטטוס עודכן ל"${r.data.status}"` : 'התאריך נשמר', 'success');
    checkNotification(ref, r.data, 'planned_date_set');
  } catch (e) { showToast('שגיאת חיבור — נסה שוב', 'error'); }
}

function showError(msg) { document.getElementById('content').innerHTML = `<div class="empty-state"><div class="empty-icon"></div><div class="empty-title">שגיאה</div><div class="empty-text">${esc(msg)}</div></div>`; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function showToast(msg, type='success') { const el = document.getElementById('toast'); el.textContent = msg; el.className = `toast ${type} visible`; clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('visible'), 4000); }
</script>
</body>
</html>
